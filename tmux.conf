set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g monitor-activity off
set -g visual-activity off
set -g repeat-time 300
set -g escape-time 5
set -g display-time 2000
set -g display-panes-time 2000
set -g history-limit 10000

set -g detach-on-destroy off
set -g remain-on-exit on

setw -g mode-keys vi
setw -g status-keys vi

set -g prefix C-b
set -g prefix2 C-a

set -g mouse on

bind -n M-k resize-pane -U 1
bind -n M-j resize-pane -D 1
bind -n M-h resize-pane -L 1
bind -n M-l resize-pane -R 1

bind -n M-Up resize-pane -U 1
bind -n M-Down resize-pane -D 1
bind -n M-Left resize-pane -L 1
bind -n M-Right resize-pane -R 1

bind -n M-g resize-pane -Z

bind -n C-k select-pane -U
bind -n C-j select-pane -D
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R

bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded."

setw -g window-size largest
setw -g aggressive-resize off
setw -g pane-border-status off

set -g status-interval 5
set -g status-position top
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-right-style 'bg=#282c34,fg=#646f75,none'
set -g status-left ' #S '
set -g status-left-length 20
set -g status-left-style 'bg=#282c34,fg=#98c379,none'
set -g status-style 'bg=#282c34,fg=#646f75,none'
set -g window-status-style 'bg=#282c34,fg=#646f75,none'
set -g window-status-format ' #I #W '
set -g window-status-current-style 'bg=#282c34,fg=#d19a66,none'
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-active-border-style none
set -g pane-border-style none
set -g display-panes-active-color '#646f75'
